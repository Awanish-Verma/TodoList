<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST | Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Testing -->
    <nav id="nav" class="nav-bar">
        <div class="nav-firsthalf">
            <p>Home</p>
            <p>Pending</p>
            <p>Completed</p>
            <p>About Us</p>
        </div>
        <button class="nav-secondhalf">
                <p class="mloginsignup">login / Sign-Up</p>
        </button>
    </nav>
    
    <section id="Todo-Space" class="todospace">
        <div class="header">
            <p class="header-id header-id1"></p>
            <p class="header-id header-id2">Task</p>
            <p class="header-id header-id3">Duration</p>
        </div>
        <div class="main-task">

        </div>
    </section>

    <div class="btn-selector">
        <button id="add" class="todo-button btn-1">Add To-Do</button>
        <button id="delete" class="todo-button btn-2">Delete To-Do</button>
    </div>






    <!-- do not touch this this is login page popup it always in last ki the body -->
    
    <div class="blurpage" id="loginPopup">
        <div class="loutercircle">
            <div class="linnercircle">
                
                <button class="close-login" id="closeLogin">✕</button>
                <p class="ldisplaylogin">Login</p>
                <p class="lloginstatement">Sign in to your account</p>

                <form action="" class="lloginform">

                    <div class="linputboxs">
                        <input type="text"class="gernal" id="lname" placeholder="Username">
                    </div>

                    <br>

                    <div class="linputboxs">
                        <input type="password" class="gernal" id="lpasswordd" placeholder="Password">
                    </div>

                    <a href="" class="lforgot">
                        <p class="lloginstatement">Forgot password?</p>
                    </a>

                    <input type="submit" id="submitt" value="SIGN IN">

                    <div class="lsignupinlogin">
                        <p class="lloginstatement">
                            Don't have an account?
                            <span class="lasignup">Sign up</span>
                        </p>
                    </div>

                </form>

            </div>
        </div>
    </div>
    
    <!-- Sign up page -->
    
    
    <div class="sblurpage" id="sloginPopup">
        <div class="loutercircle">
            <div class="linnercircle">
                <button class="close-login" id="closesignup">✕</button>
                <p class="sdisplaylogin">Sign Up</p>
                <p class="sloginstatement">create your account</p>
                <form action="" class="lloginform">
                    <div class="sinputboxs">
                        <input type="text" class="gernal" id="sname" placeholder="Full name">
                    </div>
                    <br>
                    <div class="sinputboxs">
                        <input type="email" class="gernal" id="email" placeholder="Email">
                    </div>
                    <br>
                    <div class="sinputboxs">
                        <input type="password" class="gernal" id="spasswordd" placeholder="Password">
                    </div>
                    <br>
                    <div class="sinputboxs">
                        <input type="password" class="gernal" id="scpasswordd" placeholder="Conform Password">
                    </div>
                    
                    <input type="submit" id="ssubmitt" value="CREATE ACCOUNT">
                    
                    <div class="lsignupinlogin">
                        <p class="lsloginstatement">Already have an account? <span class="sasignup">Login</span></p>
                        
                    </div>
                </form>
                
                
            </div>
        </div> 
    </div>

    <script src="script.js"></script>

</body>
</html>
