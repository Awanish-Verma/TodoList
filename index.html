<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST | Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="nav" class="nav-bar">
        <div class="nav-firsthalf">
            <p>Home</p>
            <p>Pending</p>
            <p>Completed</p>
            <p>About Us</p>
        </div>
        <button class="nav-secondhalf">
                <p class="mloginsignup">login / Sign-Up</p>
        </button>
    </nav>
    
    <section id="Todo-Space" class="todospace">

    </section>

    <div class="btn-selector">
        <button id="add" class="todo-button btn-1">Add To-Do</button>
        <button id="delete" class="todo-button btn-2">Delete To-Do</button>
    </div>






    <!-- do not touch this this is login page popup it always in last ki the body -->
    
    <div class="blurpage" id="loginPopup">
    <div class="loutercircle">
        <div class="linnercircle">
            
            <button class="close-login" id="closeLogin">✕</button>
            <p class="ldisplaylogin">Login</p>
            <p class="lloginstatement">Sign in to your account</p>

            <form action="" class="lloginform">

                <div class="linputboxs">
                    <input type="text" id="name" placeholder="Username">
                </div>

                <br>

                <div class="linputboxs">
                    <input type="password" id="passwordd" placeholder="Password">
                </div>

                <a href="" class="lforgot">
                    <p class="lloginstatement">Forgot password?</p>
                </a>

                <input type="submit" id="submitt" value="SIGN IN">

                <div class="lsignupinlogin">
                    <p class="lloginstatement">
                        Don't have an account?
                        <a href="" class="lasignup">Sign up</a>
                    </p>
                </div>

            </form>

        </div>
    </div>
</div>

    <script src="script.js"></script>

</body>
</html>
